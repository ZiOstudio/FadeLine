name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 语法检查（每个 js 都过一遍 node --check）
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Recurse -Filter *.js -Path . |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' } |
            ForEach-Object {
              node --check $_.FullName
              if ($LASTEXITCODE -ne 0) { $bad += $_.FullName }
            }
          if ($bad.Count -gt 0) {
            Write-Host "语法检查失败："
            $bad | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "全部通过"

      - name: 跑测试（布局 + 数据）
        run: npm test

      - name: JSON 文件可解析
        shell: pwsh
        run: |
          foreach ($f in @('package.json', 'config.json')) {
            if (Test-Path $f) {
              node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
              if ($LASTEXITCODE -ne 0) { Write-Host "$f 解析失败"; exit 1 }
              Write-Host "$f OK"
            }
          }
