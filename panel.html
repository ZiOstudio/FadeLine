<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>晾衣杆</title>
<style>
  :root{
    --bg:#F4F2EE; --panel:#FFFFFF; --line:#E4E1DA; --rope:#B0ADA4;
    --ink:#2C2C2A; --ink2:#6E6C66; --ink3:#9C9A93;
    --accent:#185FA5; --card-h:152px; --gap:22px; --rail-gap:34px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:13px;
  }
  .app{display:flex;flex-direction:column;height:100vh;}

  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:20px;
    padding:11px 20px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .brand{font-size:13.5px;font-weight:600;letter-spacing:.01em;}
  .brand em{font-style:normal;color:var(--ink3);font-weight:400;margin-left:8px;font-size:11.5px;}
  .folders{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);}
  .folders span{display:flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums;}
  .folders b{color:var(--ink);font-weight:600;}
  .folders .dot{width:7px;height:7px;border-radius:2px;display:inline-block;}
  .spacer{margin-left:auto;}
  .stat{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;}
  .stat b{color:var(--ink);font-size:13.5px;font-weight:600;}
  .stat.bad b{color:#A32D2D;}
  button{
    font:inherit;font-size:12px;padding:6px 12px;border-radius:7px;
    border:1px solid #D6D3CC;background:#FFF;color:var(--ink);cursor:pointer;
  }
  button:hover{border-color:#B8B4AA;background:#FBFAF8;}

  .main{flex:1 1 auto;display:flex;min-height:0;}
  .stage{flex:1 1 auto;overflow-y:auto;padding:24px 0 60px;min-width:0;}

  .rail{position:relative;padding-top:30px;margin-bottom:var(--rail-gap);}
  .rail:last-child{margin-bottom:0;}
  .rail::before{
    content:"";position:absolute;top:14px;left:16px;right:16px;height:3px;
    background:var(--rope);border-radius:2px;
  }
  .cap{position:absolute;top:9px;width:9px;height:14px;border-radius:2px;background:#C4C1B8;}
  .cap.l{left:9px;} .cap.r{right:9px;}
  .row{display:flex;justify-content:center;gap:var(--gap);padding:0 46px;min-height:var(--card-h);}
  .hint{align-self:flex-start;font-size:11.5px;color:#C6C3BA;padding-top:56px;}

  .card{
    position:relative;flex:0 0 auto;width:176px;height:var(--card-h);
    display:flex;flex-direction:column;padding:12px 12px 10px;
    border-radius:9px;border:1px solid var(--cbd,#E4E1DA);background:var(--cbg,#FFF);
    cursor:pointer;transform-origin:50% -18px;
    transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,border-color .18s;
  }
  .card:hover{transform:translateY(-3px) scale(1.035);box-shadow:0 8px 22px rgba(60,55,45,.11);z-index:3;}
  .card.on{border-color:#85B7EB;box-shadow:0 0 0 2px rgba(55,138,221,.15);}
  .card.doom{border-style:dashed;}
  .clip{position:absolute;top:-18px;left:50%;transform:translateX(-50%);
        width:12px;height:21px;border-radius:3px;background:var(--clip,#5F5E5A);}
  .src{font-size:10.5px;color:var(--ink3);margin-bottom:7px;display:flex;align-items:center;gap:5px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dot2{width:6px;height:6px;border-radius:50%;background:var(--clip);flex:0 0 auto;opacity:.8;}
  .txt{font-size:12.5px;line-height:1.55;color:var(--ct,#2C2C2A);
       display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
  .foot{position:absolute;left:12px;right:12px;bottom:8px;display:flex;justify-content:space-between;
        align-items:center;font-size:10px;}
  .age{color:var(--ink3);font-variant-numeric:tabular-nums;}
  .doomtxt{color:#A32D2D;}
  .pinmark{position:absolute;top:7px;right:9px;font-size:10px;color:#854F0B;}

  .side{
    flex:0 0 336px;border-left:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;min-height:0;
  }
  .side-in{flex:1 1 auto;overflow-y:auto;padding:18px 18px 24px;}
  .empty{color:var(--ink3);font-size:12.5px;line-height:1.8;padding:40px 0;text-align:center;}
  .badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;
         background:#F1EFE8;color:var(--ink2);margin-bottom:14px;}
  .badge.warn{background:#FAEEDA;color:#854F0B;}
  .badge.hot{background:#FCEBEB;color:#A32D2D;}
  .full{font-size:13.5px;line-height:1.75;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .meta{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
        font-size:11.5px;color:var(--ink2);line-height:1.9;}
  .meta b{color:var(--ink);font-weight:600;}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
  .acts button{flex:1 1 auto;min-width:88px;}
  .acts .del:hover{background:#FCEBEB;border-color:#E8B4B4;color:#A32D2D;}
  .path{font-family:Consolas,monospace;font-size:10.5px;color:var(--ink3);
        word-break:break-all;margin-top:12px;line-height:1.6;}
  .hist{margin-top:12px;font-size:11px;color:var(--ink3);line-height:1.8;
        border-left:2px solid var(--line);padding-left:10px;}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand">晾衣杆 <em id="vaultPath"></em></div>
    <div class="folders" id="folders"></div>
    <div class="spacer"></div>
    <div class="stat" id="statCap">—</div>
    <button id="btnFolder">打开文件夹</button>
    <button id="btnReload">刷新</button>
  </div>

  <div class="main">
    <div class="stage" id="stage"><div id="rails"></div></div>
    <div class="side"><div class="side-in" id="detail">
      <div class="empty">点一张卡片看详情。<br>按 Ctrl+Alt+Space 挂新的。</div>
    </div></div>
  </div>
</div>

<script>
let STATE = null, SEL = null;

const CLIPHEX = {red:'#A32D2D',blue:'#185FA5',amber:'#854F0B',teal:'#0F6E56',purple:'#534AB7',gray:'#5F5E5A'};
const FOLDER_META = [
  {k:'hanging', n:'01-在杆',       c:'#185FA5'},
  {k:'closet',  n:'02-衣柜',       c:'#0F6E56'},
  {k:'expired', n:'03-过期未处理',  c:'#854F0B'},
  {k:'trash',   n:'04-垃圾桶',      c:'#A32D2D'}
];
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function aging(age){
  const t = Math.min(age/20,1);
  const m=(a,b)=>Math.round(a+(b-a)*t);
  return {bg:`rgb(${m(255,214)},${m(255,210)},${m(255,201)})`,
          fg:`rgb(${m(44,140)},${m(44,136)},${m(42,128)})`,
          bd:`rgb(${m(228,197)},${m(225,191)},${m(218,181)})`};
}

async function load(){
  const r = await fetch('/api/list');
  STATE = await r.json();
  render();
}

async function settleAndLoad(){
  const r = await fetch('/api/settle',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  STATE = await r.json();
  render();
  const s = STATE.settle;
  if(s && s.moved && s.moved.length){
    flash('有 1 条进了 03-过期未处理');
  }
}

async function act(id, status, reason){
  const r = await fetch('/api/move',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id, status, reason})});
  STATE = await r.json();
  SEL = id;
  render();
}

let flashTimer;
function flash(msg){
  let el = document.getElementById('flash');
  if(!el){
    el = document.createElement('div');
    el.id='flash';
    el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2C2C2A;color:#fff;font-size:12px;padding:9px 18px;border-radius:8px;z-index:99';
    document.body.appendChild(el);
  }
  el.textContent = msg; el.style.display='block';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>el.style.display='none', 2600);
}

function render(){
  if(!STATE) return;
  const pl = STATE.ideas.filter(i=>i.status==='hanging');
  const cap = STATE.capacity;

  document.getElementById('vaultPath').textContent = STATE.vault;

  document.getElementById('folders').innerHTML = FOLDER_META.map(f=>
    `<span><i class="dot" style="background:${f.c}"></i>${f.n} <b>${STATE.counts[f.k]||0}</b></span>`
  ).join('');

  const capEl = document.getElementById('statCap');
  capEl.innerHTML = `挂在杆上 <b>${pl.length} / ${cap}</b>`;
  capEl.className = 'stat' + (pl.length >= cap ? ' bad' : '');

  const perRow = 6;
  const rails = Math.max(3, Math.ceil(pl.length/perRow) + (pl.length>=cap?1:0));
  let html = '';
  for(let r=0;r<rails;r++){
    const slice = pl.slice(r*perRow,(r+1)*perRow);
    html += '<div class="rail"><span class="cap l"></span><span class="cap r"></span><div class="row">';
    if(!slice.length){
      html += '<span class="hint">空杆 · 可挂 ' + perRow + ' 条</span>';
    } else {
      slice.forEach(c=>{
        const st = aging(c.age);
        html += `<div class="card${c.doom?' doom':''}${SEL===c.id?' on':''}" data-id="${c.id}"
          style="--cbg:${st.bg};--ct:${st.fg};--cbd:${st.bd};--clip:${CLIPHEX[c.clip]||'#5F5E5A'}">
          <span class="clip"></span>${c.pinned?'<span class="pinmark">钉</span>':''}
          <div class="src"><span class="dot2"></span>${esc(c.source)}</div>
          <div class="txt">${esc(c.text)}</div>
          <div class="foot">${c.doom
            ? `<span class="doomtxt">待淘汰 · ${c.hours_left}h</span>`
            : `<span class="age">${c.age} 天</span>`}</div>
        </div>`;
      });
    }
    html += '</div></div>';
  }
  document.getElementById('rails').innerHTML = html;
  renderDetail();
}

function renderDetail(){
  const box = document.getElementById('detail');
  const c = STATE.ideas.find(i=>i.id===SEL);
  if(!c){
    box.innerHTML = '<div class="empty">点一张卡片看详情。<br>按 Ctrl+Alt+Space 挂新的。</div>';
    return;
  }
  const fname = (FOLDER_META.find(f=>f.k===c.status)||{}).n || c.status;
  let badge = `<span class="badge">${fname}</span>`;
  if(c.doom) badge = `<span class="badge hot">待淘汰 · 还剩 ${c.hours_left} 小时</span>`;
  if(c.pinned) badge += ` <span class="badge warn">已钉住 · 不参与淘汰</span>`;

  let acts = '';
  if(c.status==='hanging'){
    acts = `<button data-a="pin">${c.pinned?'取消钉住':'钉住'}</button>
            <button data-a="closet">归档到衣柜</button>
            <button class="del" data-a="trash">删除</button>`;
  } else {
    acts = `<button data-a="hanging">还原到 01-在杆</button>
            <button class="del" data-a="trash">删除</button>`;
  }

  box.innerHTML = `
    ${badge}
    <div class="full">${esc(c.text)}</div>
    <div class="meta">
      来源：<b>${esc(c.source||'—')}</b><br>
      记录于：<b>${c.created}</b><br>
      已晾：<b>${c.age} 天</b>
    </div>
    <div class="acts" id="acts">${acts}</div>
    <div class="path">${esc(fname)}/${esc(c.filename)}</div>
  `;
  document.getElementById('acts').addEventListener('click', e=>{
    const a = e.target.dataset.a;
    if(!a) return;
    if(a==='pin') act(c.id,'pin');
    else if(a==='closet') act(c.id,'closet','我主动归档，准备做成正式选题');
    else if(a==='trash') act(c.id,'trash','我主动删除');
    else if(a==='hanging') act(c.id,'hanging','我还原回杆上');
  });
}

document.addEventListener('click', e=>{
  const card = e.target.closest('.card');
  if(card){ SEL = card.dataset.id; render(); }
});
document.getElementById('btnReload').addEventListener('click', settleAndLoad);
document.getElementById('btnFolder').addEventListener('click', ()=>{
  fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
});

settleAndLoad();
setInterval(load, 5000);
</script>
</body>
</html>
