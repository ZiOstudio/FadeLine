<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>晾衣杆浮层</title>
<style>
  html,body{
    margin:0;height:100%;overflow:hidden;background:transparent;
    font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    pointer-events:none;
    user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  #ropeSvg{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible;}

  .card{
    position:absolute;
    width:176px;height:152px;
    box-sizing:border-box;
    padding:12px 12px 10px;
    background:#FFFFFF;
    border:1px solid #E4E1DA;
    border-radius:9px;
    display:flex;flex-direction:column;
    transform-origin:50% -14px;
    opacity:0;
    pointer-events:auto;
    will-change:transform,opacity;
    box-shadow:0 1px 2px rgba(60,55,45,.05);
  }
  .clip{
    position:absolute;top:-18px;left:50%;transform:translateX(-50%);
    width:12px;height:21px;border-radius:3px;
  }
  .src{font-size:10.5px;color:#9C9A93;margin-bottom:7px;display:flex;align-items:center;gap:5px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;opacity:.8;}
  .txt{font-size:12.5px;line-height:1.55;color:#2C2C2A;
       display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
  .age{position:absolute;right:12px;bottom:8px;font-size:10px;color:#C4C1B8;font-variant-numeric:tabular-nums;}

  .card.in{animation:drop 300ms cubic-bezier(.22,1.15,.36,1) forwards; animation-delay:var(--d);}
  @keyframes drop{
    0%  {opacity:0;transform:translateY(-72px) rotate(-7deg);}
    72% {opacity:1;transform:translateY(2px) rotate(1.1deg);}
    100%{opacity:1;transform:translateY(0) rotate(0deg);}
  }
  .card.out{animation:rise 190ms cubic-bezier(.4,0,1,1) forwards;}
  @keyframes rise{
    0%  {opacity:1;transform:translateY(0) rotate(0deg);}
    100%{opacity:0;transform:translateY(-58px) rotate(-6deg);}
  }

  #hud{
    position:absolute;left:14px;bottom:8px;
    font-size:11px;color:#C4C1B8;letter-spacing:.01em;
  }
</style>
</head>
<body>
<svg id="ropeSvg" xmlns="http://www.w3.org/2000/svg">
  <path id="ropePath" fill="none" stroke="#B0ADA4" stroke-width="3" stroke-linecap="round"/>
  <circle id="pinL" r="4.5" fill="#C4C1B8"/>
  <circle id="pinR" r="4.5" fill="#C4C1B8"/>
</svg>
<div id="cards"></div>
<div id="hud"></div>

<script>
const CLIPS = ['#A32D2D','#185FA5','#854F0B','#0F6E56','#534AB7','#5F5E5A'];
const SAMPLES = [
  ['AI 换脸的伦理边界：平台该不该强制打标', 'Chrome · 关于 AI 换脸的讨论', 'red', 0],
  ['为什么慢内容在短视频时代反而更留人',   'ChatGPT',                       'blue', 1],
  ['摄影里的留白和内容里的信息密度是同一件事','小红书 · 视觉叙事笔记',          'amber', 3],
  ['做不成个人品牌的人，缺的是固定输出节奏', '飞书 · 独立开发者周会',          'teal', 5],
  ['信息茧房自检：你最近三个月新增了哪些信息源','浏览器 · 信息饮食',           'purple', 8],
  ['「整理」本身就是拖延的一种形式',        'Claude · 关于整理的对话',       'gray', 11],
  ['选题分层：日更 · 周更 · 月更长线怎么配', '飞书 · 内容排期',               'blue', 14],
  ['把评论区当选题库的采集方法',            '知乎 · 用户洞察',               'red', 18],
  ['冷启动阶段，内容数量比质量更重要吗',    '知乎 · 冷启动方法论',            'teal', 21]
];

const ROPE_TOP = 44;
const ropePath = document.getElementById('ropePath');
const pinL = document.getElementById('pinL');
const pinR = document.getElementById('pinR');
const cardsEl = document.getElementById('cards');
const hud = document.getElementById('hud');

let W = 0, SAG = 56, N = 9, showing = false;

const yAt = (t) => ROPE_TOP + 4 * SAG * t * (1 - t);

function aging(age) {
  const t = Math.min(age / 20, 1);
  const m = (a, b) => Math.round(a + (b - a) * t);
  return {
    bg: `rgb(${m(255,214)},${m(255,210)},${m(255,201)})`,
    fg: `rgb(${m(44,140)},${m(44,136)},${m(42,128)})`,
    bd: `rgb(${m(228,197)},${m(225,191)},${m(218,181)})`
  };
}

function build() {
  W = window.innerWidth;
  SAG = Math.max(30, Math.min(64, Math.round(W * 0.022)));
  N = Math.max(5, Math.min(12, Math.round(W / 280)));

  const cpY = ROPE_TOP + 2 * SAG;
  ropePath.setAttribute('d', `M 0 ${ROPE_TOP} Q ${W / 2} ${cpY} ${W} ${ROPE_TOP}`);
  pinL.setAttribute('cx', 6);  pinL.setAttribute('cy', ROPE_TOP);
  pinR.setAttribute('cx', W - 6); pinR.setAttribute('cy', ROPE_TOP);

  const L = ropePath.getTotalLength();
  ropePath.style.strokeDasharray = L;
  ropePath.style.strokeDashoffset = L;

  cardsEl.innerHTML = '';
  for (let i = 0; i < N; i++) {
    const t = (i + 0.5) / N;
    const [text, source, clip, age] = SAMPLES[i % SAMPLES.length];
    const st = aging(age);
    const el = document.createElement('div');
    el.className = 'card';
    el.style.left = Math.round(W * t - 88) + 'px';
    el.style.top = Math.round(yAt(t) + 12) + 'px';
    el.style.setProperty('--d', Math.round(360 * t) + 'ms');
    el.style.background = st.bg;
    el.style.borderColor = st.bd;
    el.innerHTML =
      `<span class="clip" style="background:${CLIPS[i % CLIPS.length]}"></span>` +
      `<div class="src"><span class="dot" style="background:${CLIPS[i % CLIPS.length]}"></span>${source}</div>` +
      `<div class="txt" style="color:${st.fg}">${text}</div>` +
      `<div class="age">${age} 天</div>`;
    cardsEl.appendChild(el);
  }
}

function expand() {
  showing = true;
  build();
  ropePath.style.transition = 'none';
  ropePath.style.strokeDashoffset = ropePath.getTotalLength();
  void ropePath.getBoundingClientRect();

  requestAnimationFrame(() => {
    ropePath.style.transition = 'stroke-dashoffset 360ms cubic-bezier(.16,1,.3,1)';
    ropePath.style.strokeDashoffset = 0;
  });
  pinL.style.opacity = pinR.style.opacity = 0;
  setTimeout(() => { pinL.style.opacity = pinR.style.opacity = 1; }, 340);

  [...cardsEl.children].forEach(el => {
    el.classList.remove('out');
    el.classList.add('in');
  });
  hud.textContent = '';
}

function collapse() {
  showing = false;
  [...cardsEl.children].forEach(el => {
    el.classList.remove('in');
    el.classList.add('out');
  });
  ropePath.style.transition = 'stroke-dashoffset 200ms cubic-bezier(.4,0,1,1)';
  ropePath.style.strokeDashoffset = ropePath.getTotalLength();
  pinL.style.opacity = pinR.style.opacity = 0;
}

// 点击穿透：鼠标在卡片上时收回穿透，其余区域一律穿透到桌面
document.addEventListener('mousemove', (e) => {
  if (!showing) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const onCard = !!(el && el.closest && el.closest('.card'));
  if (window.rail) window.rail.setIgnore(!onCard);
  hud.textContent = onCard
    ? '在卡片上 · 鼠标事件已接管'
    : '空白区域 · 鼠标事件穿透到桌面';
});

document.addEventListener('mouseleave', () => { if (window.rail) window.rail.setIgnore(true); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && window.rail) window.rail.hide(); });
window.addEventListener('resize', () => { if (showing) build(); });

if (window.rail) {
  window.rail.onExpand(expand);
  window.rail.onCollapse(collapse);
} else {
  // 在普通浏览器里打开时直接展开，方便单独预览效果
  document.body.style.background = '#EDEBE6';
  setTimeout(expand, 120);
  document.addEventListener('click', () => (showing ? collapse() : expand()));
}
</script>
</body>
</html>
